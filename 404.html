<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | BEZ CRAFT</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/assets/images/bezcraft-mark.svg">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/site.css">
    <style>
        .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px 16px; }
        .notfound img { width: 104px; margin: 0 auto 28px; image-rendering: pixelated; }
        .notfound .code { font-family: var(--mono); color: var(--accent); margin-bottom: 8px; }
        .notfound .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    </style>
</head>
<body>
    <main class="notfound">
        <div>
            <img src="/assets/images/bezcraft-mark.svg" alt="BEZ CRAFT logo" width="104" height="70">
            <p class="code">Error 404</p>
            <h1>Page not found</h1>
            <p>The page you are looking for does not exist or has moved.</p>
            <div class="actions">
                <a class="btn btn-primary btn-lg" href="/">Go to homepage</a>
                <a class="btn btn-secondary btn-lg" href="/#contact">Contact us</a>
            </div>
        </div>
    </main>
</body>
</html>
